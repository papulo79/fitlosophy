  motivo_descarte: null
  fecha_importacion: '2026-09-03T19:24:08'
  fecha_decision: null
  etiquetas:
    id: 3-4-sit-up
    patron: core_flexion_cadera
    secundarios: []
    nivel: base
    lateralidad: bilateral
    impacto_lumbar: verde
    compatibilidad_bjj: si
