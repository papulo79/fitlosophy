version: 2

valores:
  impacto_lumbar: [verde, amarillo, rojo]
  compatibilidad_bjj: [si, limitada, no]
  nivel: [base, intermedio, avanzado]
  lateralidad: [bilateral, unilateral]
  nivel_coste: [bajo, medio, alto]
  dimensiones:
    - lumbar
    - bisagra
    - rodilla_piernas
    - empuje
    - tiron
    - agarre
    - core
    - cardio
    - impacto_articular
  patron:
    - empuje_horizontal
    - empuje_vertical
    - tiron_horizontal
    - tiron_vertical
    - dominante_rodilla
    - dominante_cadera
    - core_antiextension
    - core_antirotacion
    - core_lateral
    - core_flexion_cadera
    - core_rotacion
    - acondicionamiento
    - agilidad
    - movilidad_cargada
    - recuperacion

exercises:
  - id: pushup-classic
    nombre: Flexión clásica
    patron: empuje_horizontal
    material: [tatami]
    nivel: base
    lateralidad: bilateral
    coste_dimensiones: {empuje: bajo, core: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [fuerza_resistencia, volumen]
    progresiones: [pushup-feet-elevated]
    prescripcion:
      series: [3, 5]
      repeticiones: [10, 20]
      reserva_repeticiones: [3, 5]

  - id: pushup-feet-elevated
    nombre: Flexión con pies elevados
    patron: empuje_horizontal
    material: [caja, tatami]
    nivel: intermedio
    lateralidad: bilateral
    coste_dimensiones: {empuje: medio, core: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [fuerza, volumen]
    regresiones: [pushup-classic]
    sustitutos: [pike-pushup]
    prescripcion:
      series: [3, 4]
      repeticiones: [8, 15]

  - id: pike-pushup
    nombre: Flexión en pica
    patron: empuje_vertical
    material: [tatami]
    nivel: intermedio
    lateralidad: bilateral
    coste_dimensiones: {empuje: medio, core: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [fuerza, hombros]
    sustitutos: [kb-press]
    prescripcion:
      series: [3, 4]
      repeticiones: [6, 12]

  - id: kb-press
    nombre: Press militar con kettlebell
    patron: empuje_vertical
    material: [kettlebell]
    nivel: intermedio
    lateralidad: unilateral
    coste_dimensiones: {empuje: medio, core: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: limitada
    objetivos: [fuerza, hombros, estabilidad]
    regresiones: [pike-pushup]
    prescripcion:
      series: [3, 5]
      repeticiones: [5, 10]
      por_lado: true

  - id: trx-row
    nombre: Remo en TRX
    patron: tiron_horizontal
    material: [trx]
    nivel: base
    lateralidad: bilateral
    coste_dimensiones: {tiron: bajo, agarre: bajo, core: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [fuerza_resistencia, tecnica, recuperacion]
    sustitutos: [kb-row-supported]
    prescripcion:
      series: [3, 5]
      repeticiones: [8, 15]

  - id: kb-row-supported
    nombre: Remo unilateral con kettlebell y apoyo
    patron: tiron_horizontal
    secundarios: [core_antirotacion]
    material: [kettlebell, caja]
    nivel: intermedio
    lateralidad: unilateral
    coste_dimensiones: {tiron: medio, agarre: medio, core: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [fuerza]
    sustitutos: [trx-row]
    prescripcion:
      series: [3, 5]
      repeticiones: [6, 12]
      por_lado: true

  - id: pullup-strict
    nombre: Dominada estricta
    patron: tiron_vertical
    material: [barra_dominadas]
    nivel: avanzado
    lateralidad: bilateral
    coste_dimensiones: {tiron: medio, agarre: medio}
    impacto_lumbar: verde
    compatibilidad_bjj: limitada
    objetivos: [fuerza]
    regresiones: [pullup-band-assisted]
    prescripcion:
      repeticiones_totales: [10, 14]
      evitar_fallo: true

  - id: pullup-band-assisted
    nombre: Dominada asistida con goma
    patron: tiron_vertical
    material: [barra_dominadas, goma]
    nivel: base
    lateralidad: bilateral
    coste_dimensiones: {tiron: bajo, agarre: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [fuerza_resistencia, tecnica]
    progresiones: [pullup-strict]
    sustitutos: [trx-row]
    prescripcion:
      series: [3, 5]
      repeticiones: [5, 10]
      evitar_fallo: true

  - id: goblet-squat
    nombre: Goblet squat
    patron: dominante_rodilla
    material: [kettlebell]
    nivel: base
    lateralidad: bilateral
    coste_dimensiones: {rodilla_piernas: medio, core: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [fuerza_resistencia]
    progresiones: [bulgarian-squat-trx]
    prescripcion:
      series: [3, 5]
      repeticiones: [8, 15]

  - id: bulgarian-squat-trx
    nombre: Sentadilla búlgara asistida con TRX
    patron: dominante_rodilla
    material: [trx, caja]
    nivel: intermedio
    lateralidad: unilateral
    coste_dimensiones: {rodilla_piernas: medio, agarre: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [fuerza_unilateral, estabilidad]
    regresiones: [goblet-squat]
    progresiones: [pistol-trx]
    prescripcion:
      series: [3, 4]
      repeticiones: [6, 10]
      por_lado: true

  - id: pistol-trx
    nombre: Pistol asistida con TRX
    patron: dominante_rodilla
    material: [trx]
    nivel: avanzado
    lateralidad: unilateral
    coste_dimensiones: {rodilla_piernas: medio, agarre: bajo, core: bajo}
    impacto_lumbar: amarillo
    compatibilidad_bjj: limitada
    objetivos: [fuerza_unilateral, habilidad]
    regresiones: [bulgarian-squat-trx]
    prescripcion:
      series: [3, 5]
      repeticiones: [3, 6]
      por_lado: true

  - id: glute-bridge
    nombre: Puente de glúteos
    patron: dominante_cadera
    material: [tatami]
    nivel: base
    lateralidad: bilateral
    coste_dimensiones: {bisagra: bajo, lumbar: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [activacion, recuperacion]
    progresiones: [kb-deadlift]
    prescripcion:
      series: [2, 4]
      repeticiones: [10, 20]

  - id: kb-deadlift
    nombre: Peso muerto con kettlebell
    patron: dominante_cadera
    material: [kettlebell]
    nivel: intermedio
    lateralidad: bilateral
    coste_dimensiones: {bisagra: medio, lumbar: medio, agarre: bajo}
    impacto_lumbar: amarillo
    compatibilidad_bjj: limitada
    objetivos: [tecnica, fuerza]
    regresiones: [glute-bridge]
    progresiones: [kb-swing-two-hand]
    prescripcion:
      series: [3, 5]
      repeticiones: [5, 8]

  - id: kb-swing-two-hand
    nombre: Swing a dos manos
    patron: dominante_cadera
    material: [kettlebell]
    nivel: intermedio
    lateralidad: bilateral
    explosivo: true
    coste_dimensiones: {bisagra: alto, lumbar: medio, agarre: medio, cardio: medio}
    impacto_lumbar: amarillo
    compatibilidad_bjj: no
    objetivos: [potencia, acondicionamiento]
    regresiones: [kb-deadlift]
    progresiones: [kb-swing-one-hand]
    prescripcion:
      series: [6, 10]
      repeticiones: [8, 10]
      detener_si_falla_tecnica: true

  - id: kb-swing-one-hand
    nombre: Swing a una mano
    patron: dominante_cadera
    secundarios: [core_antirotacion]
    material: [kettlebell]
    nivel: avanzado
    lateralidad: unilateral
    explosivo: true
    coste_dimensiones: {bisagra: alto, lumbar: alto, agarre: alto, core: medio}
    impacto_lumbar: rojo
    compatibilidad_bjj: no
    objetivos: [potencia, agarre, antirotacion]
    regresiones: [kb-swing-two-hand]

  - id: windmill
    nombre: Windmill con kettlebell
    patron: movilidad_cargada
    secundarios: [core_lateral]
    material: [kettlebell]
    nivel: avanzado
    lateralidad: unilateral
    coste_dimensiones: {lumbar: alto, core: medio, empuje: bajo}
    impacto_lumbar: rojo
    compatibilidad_bjj: no
    objetivos: [movilidad, estabilidad, fuerza]
    prescripcion:
      series: [3, 4]
      repeticiones: [3, 5]
      por_lado: true

  - id: plank-front
    nombre: Plancha frontal
    patron: core_antiextension
    material: [tatami]
    nivel: base
    lateralidad: bilateral
    isometrico: true
    coste_dimensiones: {core: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [estabilidad_lumbopelvica]
    sustitutos: [dead-bug]
    prescripcion:
      series: [2, 4]
      segundos: [20, 45]

  - id: dead-bug
    nombre: Dead bug
    patron: core_antiextension
    material: [tatami]
    nivel: base
    lateralidad: bilateral
    coste_dimensiones: {core: bajo, lumbar: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [estabilidad_lumbopelvica, control, recuperacion]
    sustitutos: [plank-front]
    prescripcion:
      series: [2, 4]
      repeticiones: [6, 10]
      por_lado: true

  - id: pallof-press
    nombre: Pallof press con goma
    patron: core_antirotacion
    material: [goma]
    nivel: base
    lateralidad: unilateral
    coste_dimensiones: {core: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [estabilidad_lumbopelvica]
    sustitutos: [plank-front]
    prescripcion:
      series: 3
      repeticiones: [8, 12]
      por_lado: true

  - id: side-plank
    nombre: Plancha lateral
    patron: core_lateral
    material: [tatami]
    nivel: base
    lateralidad: unilateral
    isometrico: true
    coste_dimensiones: {core: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [estabilidad_lateral]
    prescripcion:
      series: [2, 3]
      segundos: [20, 40]
      por_lado: true

  - id: hanging-knee-raise
    nombre: Elevación de rodillas colgado
    patron: core_flexion_cadera
    material: [barra_dominadas]
    nivel: intermedio
    lateralidad: bilateral
    coste_dimensiones: {core: medio, agarre: medio}
    impacto_lumbar: amarillo
    compatibilidad_bjj: si
    objetivos: [core, control]
    prescripcion:
      series: [3, 5]
      repeticiones: [5, 10]
      sin_balanceo: true

  - id: russian-twist
    nombre: Russian twist cargado
    patron: core_rotacion
    material: [kettlebell, tatami]
    nivel: avanzado
    lateralidad: bilateral
    coste_dimensiones: {core: alto, lumbar: alto}
    impacto_lumbar: rojo
    compatibilidad_bjj: no
    objetivos: [rotacion]
    sustitutos: [pallof-press]
    opcional: true

  - id: rope-technical
    nombre: Comba técnica
    patron: acondicionamiento
    material: [comba]
    nivel: base
    lateralidad: bilateral
    coste_dimensiones: {cardio: bajo, impacto_articular: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [coordinacion, cardio]
    prescripcion:
      series: 5
      saltos: 100

  - id: agility-ladder-basic
    nombre: Escalera de agilidad básica
    patron: agilidad
    material: [escalera_agilidad]
    nivel: base
    lateralidad: bilateral
    coste_dimensiones: {cardio: bajo, impacto_articular: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [coordinacion, calentamiento]
    prescripcion:
      pasadas_por_patron: [4, 6]

  - id: cones-zigzag
    nombre: Zigzag entre conos
    patron: agilidad
    material: [conos]
    nivel: intermedio
    lateralidad: bilateral
    explosivo: true
    coste_dimensiones: {cardio: medio, impacto_articular: medio, rodilla_piernas: bajo}
    impacto_lumbar: amarillo
    compatibilidad_bjj: si
    objetivos: [cambio_direccion, aceleracion]
    prescripcion:
      recorridos: [4, 8]

  - id: treadmill-walk
    nombre: Caminata en cinta
    patron: recuperacion
    material: [cinta]
    nivel: base
    lateralidad: bilateral
    coste_dimensiones: {cardio: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [recuperacion_activa, actividad_baja_intensidad]
    prescripcion:
      minutos: [20, 45]
    uso_preferente: recuperacion
