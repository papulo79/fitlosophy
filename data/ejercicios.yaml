version: 2

valores:
  impacto_lumbar: [verde, amarillo, rojo]
  compatibilidad_bjj: [si, limitada, no]
  nivel: [base, intermedio, avanzado]
  lateralidad: [bilateral, unilateral]
  nivel_coste: [bajo, medio, alto]
  dimensiones:
    - lumbar
    - bisagra
    - rodilla_piernas
    - empuje
    - tiron
    - agarre
    - core
    - cardio
    - impacto_articular
  patron:
    - empuje_horizontal
    - empuje_vertical
    - tiron_horizontal
    - tiron_vertical
    - dominante_rodilla
    - dominante_cadera
    - core_antiextension
    - core_antirotacion
    - core_lateral
    - core_flexion_cadera
    - core_rotacion
    - acondicionamiento
    - agilidad
    - movilidad_cargada
    - recuperacion

exercises:
  - id: pushup-classic
    nombre: Flexión clásica
    descripcion: >-
      Manos bajo los hombros y cuerpo en línea de talones a cabeza. Baja hasta que el pecho roce el suelo sin que la cadera se hunda y sube extendiendo los codos.
    patron: empuje_horizontal
    material: [tatami]
    sin_material: true
    nivel: base
    lateralidad: bilateral
    coste_dimensiones: {empuje: bajo, core: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [fuerza_resistencia, volumen]
    progresiones: [pushup-feet-elevated]
    prescripcion:
      series: [3, 5]
      repeticiones: [10, 20]
      reserva_repeticiones: [3, 5]

  - id: pushup-feet-elevated
    nombre: Flexión con pies elevados
    descripcion: >-
      Flexión con los pies sobre la caja: cuanto más alta, más peso va al hombro. Mantén la línea del cuerpo; si la cadera cae, baja la altura del apoyo.
    patron: empuje_horizontal
    material: [caja, tatami]
    nivel: intermedio
    lateralidad: bilateral
    coste_dimensiones: {empuje: medio, core: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [fuerza, volumen]
    regresiones: [pushup-classic]
    sustitutos: [pike-pushup]
    prescripcion:
      series: [3, 4]
      repeticiones: [8, 15]

  - id: pike-pushup
    nombre: Flexión en pica
    descripcion: >-
      Con las caderas altas en V invertida, baja la coronilla hacia el suelo entre las manos y empuja de vuelta. Cuanto más vertical el tronco, más carga sobre el hombro.
    patron: empuje_vertical
    material: [tatami]
    sin_material: true
    nivel: intermedio
    lateralidad: bilateral
    coste_dimensiones: {empuje: medio, core: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [fuerza, hombros]
    sustitutos: [kb-press]
    prescripcion:
      series: [3, 4]
      repeticiones: [6, 12]

  - id: kb-press
    nombre: Press militar con kettlebell
    descripcion: >-
      De pie, con la pesa en rack a la altura del hombro, empuja vertical hasta extender el codo. Aprieta glúteo y abdomen para no arquear la lumbar al buscar el recorrido final.
    patron: empuje_vertical
    material: [kettlebell]
    nivel: intermedio
    lateralidad: unilateral
    coste_dimensiones: {empuje: medio, core: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: limitada
    objetivos: [fuerza, hombros, estabilidad]
    regresiones: [pike-pushup]
    prescripcion:
      series: [3, 5]
      repeticiones: [5, 10]
      por_lado: true

  - id: trx-row
    nombre: Remo en TRX
    descripcion: >-
      Cuerpo en línea y talones fijos, tira de las asas hacia los costados juntando las escápulas. Cuanto más horizontal te coloques, más dura la serie.
    patron: tiron_horizontal
    material: [trx]
    nivel: base
    lateralidad: bilateral
    coste_dimensiones: {tiron: bajo, agarre: bajo, core: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [fuerza_resistencia, tecnica, recuperacion]
    sustitutos: [kb-row-supported]
    prescripcion:
      series: [3, 5]
      repeticiones: [8, 15]

  - id: kb-row-supported
    nombre: Remo unilateral con kettlebell y apoyo
    descripcion: >-
      Mano y rodilla sobre la caja, espalda paralela al suelo. Rema llevando el codo al costado sin que la cadera rote: resistir esa rotación es parte del ejercicio.
    patron: tiron_horizontal
    secundarios: [core_antirotacion]
    material: [kettlebell, caja]
    nivel: intermedio
    lateralidad: unilateral
    coste_dimensiones: {tiron: medio, agarre: medio, core: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [fuerza]
    sustitutos: [trx-row]
    prescripcion:
      series: [3, 5]
      repeticiones: [6, 12]
      por_lado: true

  - id: pullup-strict
    nombre: Dominada estricta
    descripcion: >-
      Desde suspensión completa, sube hasta pasar la barbilla por encima de la barra sin impulso de cadera, y baja controlado hasta extender del todo. No se llega al fallo.
    patron: tiron_vertical
    material: [barra_dominadas]
    nivel: avanzado
    lateralidad: bilateral
    coste_dimensiones: {tiron: medio, agarre: medio}
    impacto_lumbar: verde
    compatibilidad_bjj: limitada
    objetivos: [fuerza]
    regresiones: [pullup-band-assisted]
    prescripcion:
      repeticiones_totales: [10, 14]
      evitar_fallo: true

  - id: pullup-band-assisted
    nombre: Dominada asistida con goma
    descripcion: >-
      Dominada con la goma bajo la rodilla o el pie. Usa la goma más floja que te permita completar repeticiones limpias, y retírala cuando sobren.
    patron: tiron_vertical
    material: [barra_dominadas, goma]
    nivel: base
    lateralidad: bilateral
    coste_dimensiones: {tiron: bajo, agarre: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [fuerza_resistencia, tecnica]
    progresiones: [pullup-strict]
    sustitutos: [trx-row]
    prescripcion:
      series: [3, 5]
      repeticiones: [5, 10]
      evitar_fallo: true

  - id: goblet-squat
    nombre: Goblet squat
    descripcion: >-
      Pesa sujeta contra el pecho con los codos dentro. Baja entre los pies con el tronco erguido, hasta donde puedas sin que la pelvis se enrosque al final del recorrido.
    patron: dominante_rodilla
    material: [kettlebell]
    nivel: base
    lateralidad: bilateral
    coste_dimensiones: {rodilla_piernas: medio, core: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [fuerza_resistencia]
    progresiones: [bulgarian-squat-trx]
    prescripcion:
      series: [3, 5]
      repeticiones: [8, 15]

  - id: bulgarian-squat-trx
    nombre: Sentadilla búlgara asistida con TRX
    descripcion: >-
      Pie trasero apoyado en la caja y asas del TRX como referencia de equilibrio, no como apoyo de carga. Baja vertical sobre la pierna delantera.
    patron: dominante_rodilla
    material: [trx, caja]
    nivel: intermedio
    lateralidad: unilateral
    coste_dimensiones: {rodilla_piernas: medio, agarre: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [fuerza_unilateral, estabilidad]
    regresiones: [goblet-squat]
    progresiones: [pistol-trx]
    prescripcion:
      series: [3, 4]
      repeticiones: [6, 10]
      por_lado: true

  - id: pistol-trx
    nombre: Pistol asistida con TRX
    descripcion: >-
      Sentadilla a una pierna asistiéndote lo justo con el TRX. Exige control de rodilla y tobillo: si la rodilla se desvía hacia dentro, vuelve a la búlgara.
    patron: dominante_rodilla
    material: [trx]
    nivel: avanzado
    lateralidad: unilateral
    coste_dimensiones: {rodilla_piernas: medio, agarre: bajo, core: bajo}
    impacto_lumbar: amarillo
    compatibilidad_bjj: limitada
    objetivos: [fuerza_unilateral, habilidad]
    regresiones: [bulgarian-squat-trx]
    prescripcion:
      series: [3, 5]
      repeticiones: [3, 6]
      por_lado: true

  - id: glute-bridge
    nombre: Puente de glúteos
    descripcion: >-
      Tumbado boca arriba con los pies cerca del glúteo, eleva la cadera empujando con los talones hasta alinear rodilla, cadera y hombro. El empuje sale del glúteo, no de la lumbar.
    patron: dominante_cadera
    material: [tatami]
    sin_material: true
    nivel: base
    lateralidad: bilateral
    coste_dimensiones: {bisagra: bajo, lumbar: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [activacion, recuperacion]
    progresiones: [kb-deadlift]
    prescripcion:
      series: [2, 4]
      repeticiones: [10, 20]

  - id: kb-deadlift
    nombre: Peso muerto con kettlebell
    descripcion: >-
      Pesa entre los pies. Bisagra de cadera con la espalda neutra, tira empujando el suelo y bloquea arriba apretando el glúteo. Es el patrón que enseña el swing.
    patron: dominante_cadera
    material: [kettlebell]
    nivel: intermedio
    lateralidad: bilateral
    coste_dimensiones: {bisagra: medio, lumbar: medio, agarre: bajo}
    impacto_lumbar: amarillo
    compatibilidad_bjj: limitada
    objetivos: [tecnica, fuerza]
    regresiones: [glute-bridge]
    progresiones: [kb-swing-two-hand]
    prescripcion:
      series: [3, 5]
      repeticiones: [5, 8]

  - id: kb-swing-two-hand
    nombre: Swing a dos manos
    descripcion: >-
      Balanceo de cadera, no sentadilla: la pesa cae entre las piernas y sube por la extensión explosiva de cadera hasta la altura del pecho, con los brazos solo acompañando. Corta la serie en cuanto la espalda empiece a redondearse.
    patron: dominante_cadera
    material: [kettlebell]
    nivel: intermedio
    lateralidad: bilateral
    explosivo: true
    coste_dimensiones: {bisagra: alto, lumbar: medio, agarre: medio, cardio: medio}
    impacto_lumbar: amarillo
    compatibilidad_bjj: no
    objetivos: [potencia, acondicionamiento]
    regresiones: [kb-deadlift]
    progresiones: [kb-swing-one-hand]
    prescripcion:
      series: [6, 10]
      repeticiones: [8, 10]
      detener_si_falla_tecnica: true

  - id: kb-swing-one-hand
    nombre: Swing a una mano
    descripcion: >-
      Swing sujetando con una sola mano, lo que añade una fuerte demanda de agarre y de resistencia a la rotación. Impacto lumbar alto: fuera de días amarillos o rojos y de las vísperas de BJJ.
    patron: dominante_cadera
    secundarios: [core_antirotacion]
    material: [kettlebell]
    nivel: avanzado
    lateralidad: unilateral
    explosivo: true
    coste_dimensiones: {bisagra: alto, lumbar: alto, agarre: alto, core: medio}
    impacto_lumbar: rojo
    compatibilidad_bjj: no
    objetivos: [potencia, agarre, antirotacion]
    regresiones: [kb-swing-two-hand]

  - id: windmill
    nombre: Windmill con kettlebell
    descripcion: >-
      Con la pesa bloqueada sobre la cabeza y la mirada puesta en ella, baja la mano libre hacia el suelo girando la cadera. Movilidad cargada exigente y de impacto lumbar alto: se hace despacio o no se hace.
    patron: movilidad_cargada
    secundarios: [core_lateral]
    material: [kettlebell]
    nivel: avanzado
    lateralidad: unilateral
    coste_dimensiones: {lumbar: alto, core: medio, empuje: bajo}
    impacto_lumbar: rojo
    compatibilidad_bjj: no
    objetivos: [movilidad, estabilidad, fuerza]
    prescripcion:
      series: [3, 4]
      repeticiones: [3, 5]
      por_lado: true

  - id: plank-front
    nombre: Plancha frontal
    descripcion: >-
      Antebrazos bajo los hombros y cuerpo en línea. Aprieta glúteo y abdomen para que la lumbar no se arquee; cuando se arquea, la serie ha terminado aunque queden segundos.
    patron: core_antiextension
    material: [tatami]
    sin_material: true
    nivel: base
    lateralidad: bilateral
    isometrico: true
    coste_dimensiones: {core: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [estabilidad_lumbopelvica]
    sustitutos: [dead-bug]
    prescripcion:
      series: [2, 4]
      segundos: [20, 45]

  - id: dead-bug
    nombre: Dead bug
    descripcion: >-
      Boca arriba con la lumbar pegada al suelo, extiende brazo y pierna contrarios sin perder ese contacto. Si la espalda se despega, acorta el recorrido.
    patron: core_antiextension
    material: [tatami]
    sin_material: true
    nivel: base
    lateralidad: bilateral
    coste_dimensiones: {core: bajo, lumbar: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [estabilidad_lumbopelvica, control, recuperacion]
    sustitutos: [plank-front]
    prescripcion:
      series: [2, 4]
      repeticiones: [6, 10]
      por_lado: true

  - id: pallof-press
    nombre: Pallof press con goma
    descripcion: >-
      De pie y de perfil a la goma, lleva las manos del pecho al frente resistiendo el tirón que intenta girarte. El ejercicio consiste en no rotar.
    patron: core_antirotacion
    material: [goma]
    nivel: base
    lateralidad: unilateral
    coste_dimensiones: {core: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [estabilidad_lumbopelvica]
    sustitutos: [plank-front]
    prescripcion:
      series: 3
      repeticiones: [8, 12]
      por_lado: true

  - id: side-plank
    nombre: Plancha lateral
    descripcion: >-
      Apoyo sobre el antebrazo y el canto del pie, con la cadera alta y alineada. Si el hombro molesta, apoya la rodilla de abajo.
    patron: core_lateral
    material: [tatami]
    sin_material: true
    nivel: base
    lateralidad: unilateral
    isometrico: true
    coste_dimensiones: {core: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [estabilidad_lateral]
    prescripcion:
      series: [2, 3]
      segundos: [20, 40]
      por_lado: true

  - id: hanging-knee-raise
    nombre: Elevación de rodillas colgado
    descripcion: >-
      Colgado de la barra, sube las rodillas hacia el pecho sin balanceo, enroscando ligeramente la pelvis al final. Suele limitar antes el agarre que el abdomen.
    patron: core_flexion_cadera
    material: [barra_dominadas]
    nivel: intermedio
    lateralidad: bilateral
    coste_dimensiones: {core: medio, agarre: medio}
    impacto_lumbar: amarillo
    compatibilidad_bjj: si
    objetivos: [core, control]
    prescripcion:
      series: [3, 5]
      repeticiones: [5, 10]
      sin_balanceo: true

  - id: russian-twist
    nombre: Russian twist cargado
    descripcion: >-
      Sentado con el tronco inclinado atrás, lleva la pesa de un lado a otro rotando el tronco. Es rotación lumbar cargada: ante cualquier molestia se cambia por el pallof press.
    patron: core_rotacion
    material: [kettlebell, tatami]
    nivel: avanzado
    lateralidad: bilateral
    coste_dimensiones: {core: alto, lumbar: alto}
    impacto_lumbar: rojo
    compatibilidad_bjj: no
    objetivos: [rotacion]
    sustitutos: [pallof-press]
    opcional: true

  - id: rope-technical
    nombre: Comba técnica
    descripcion: >-
      Series de comba a ritmo cómodo, buscando continuidad y aterrizaje suave por delante de la velocidad. Corta la serie si el pie empieza a golpear fuerte el suelo.
    patron: acondicionamiento
    material: [comba]
    nivel: base
    lateralidad: bilateral
    coste_dimensiones: {cardio: bajo, impacto_articular: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [coordinacion, cardio]
    prescripcion:
      series: 5
      saltos: 100

  - id: agility-ladder-basic
    nombre: Escalera de agilidad básica
    descripcion: >-
      Pasadas por la escalera a pie ligero y con la mirada al frente, buscando cadencia limpia antes que velocidad. Se completan las pasadas indicadas de cada patrón de la lista.
    patrones:
      - Un pie por casilla
      - Dos pies por casilla
      - Entradas y salidas laterales
      - Dentro-dentro-fuera-fuera
      - Desplazamiento lateral cruzando (carioca)
    patron: agilidad
    material: [escalera_agilidad]
    nivel: base
    lateralidad: bilateral
    coste_dimensiones: {cardio: bajo, impacto_articular: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [coordinacion, calentamiento]
    prescripcion:
      pasadas_por_patron: [4, 6]

  - id: cones-zigzag
    nombre: Zigzag entre conos
    descripcion: >-
      Carreras cortas cambiando de dirección en cada cono, bajando el centro de gravedad al frenar y apoyando el pie externo para reorientar. Es lo que más se parece al desplazamiento en pie del BJJ.
    patron: agilidad
    material: [conos]
    nivel: intermedio
    lateralidad: bilateral
    explosivo: true
    coste_dimensiones: {cardio: medio, impacto_articular: medio, rodilla_piernas: bajo}
    impacto_lumbar: amarillo
    compatibilidad_bjj: si
    objetivos: [cambio_direccion, aceleracion]
    prescripcion:
      recorridos: [4, 8]

  - id: treadmill-walk
    nombre: Caminata en cinta
    descripcion: >-
      Caminata continua a ritmo conversacional y sin inclinación agresiva. El objetivo es mover sangre, no acumular fatiga.
    patron: recuperacion
    material: [cinta]
    nivel: base
    lateralidad: bilateral
    coste_dimensiones: {cardio: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [recuperacion_activa, actividad_baja_intensidad]
    prescripcion:
      minutos: [20, 45]
    uso_preferente: recuperacion

  - id: squat-libre
    nombre: Sentadilla libre
    descripcion: >-
      Sentadilla sin carga con los pies a la anchura de los hombros. Baja controlado hasta donde mantengas el tronco firme y la pelvis neutra.
    patron: dominante_rodilla
    material: []
    sin_material: true
    nivel: base
    lateralidad: bilateral
    coste_dimensiones: {rodilla_piernas: bajo, core: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [fuerza_resistencia, volumen]
    progresiones: [goblet-squat]
    prescripcion:
      series: [3, 5]
      repeticiones: [15, 25]

  - id: lunge-forward
    nombre: Zancada hacia delante
    descripcion: >-
      Da un paso al frente y baja vertical hasta que la rodilla trasera roce el suelo, con el tronco erguido. Empuja con el talón delantero para volver.
    patron: dominante_rodilla
    material: []
    sin_material: true
    nivel: base
    lateralidad: unilateral
    coste_dimensiones: {rodilla_piernas: medio, core: bajo}
    impacto_lumbar: verde
    compatibilidad_bjj: si
    objetivos: [fuerza_unilateral, estabilidad]
    progresiones: [goblet-squat]
    prescripcion:
      series: [3, 4]
      repeticiones: [8, 12]
      por_lado: true
